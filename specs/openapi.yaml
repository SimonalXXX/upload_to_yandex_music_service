openapi: 3.1.0
info:
  title: Музыкальный — локальный HTTP API
  description: |
    REST API веб-приложения (`web_app.py`). Сервер слушает только 127.0.0.1.
    Поток прогресса — отдельный контракт GET `/api/progress`, см. `sse-events.md`.

    **2.0.0** (новый интерфейс, `specs/features/ui-redesign.md`): удалён `POST /api/save`
    (заменён `GET/POST /api/settings`); статус трека `unavailable`; задачи идут через общую
    обёртку с историей (`/api/history`); добавлены синхронизация, проверки при вводе,
    плеер, снятие отметки «В ЯМ».

    **2.1.0** (`specs/features/upload-confirmation.md`): статус `sent` («Ждёт ЯМ») — ЯМ принял файл,
    но трек ещё не найден в плейлисте; поле трека `sent_at`; `stats.sent`; в отчёте сверки —
    `sent_waiting`, `confirmed_now`, `expired_now`; в итогах загрузки — `sent`.

    **3.0.0** (`specs/features/track-states.md`, ломающее): у трека вместо `status` — три признака:
    `has_file` (диск), `ym` (+ `ym_checked_at`, `sent_at`), `liked` + `sc` (+ `sc_reason`); статистика
    по признакам; сверка записывает результат в `ym` и отдаёт `missing`/`rejected`/`sent_waiting` и
    `changes`. Миграция: клиент один — встроенный интерфейс, обновлён в том же релизе.
  version: "3.0.0"

servers:
  - url: http://127.0.0.1:5555
    description: Локальный экземпляр по умолчанию

paths:
  /:
    get:
      summary: Главная страница
      description: HTML-оболочка (`templates/index.html`); интерфейс — ES-модули из `/static/js`.
      responses:
        "200":
          description: HTML-документ

  /api/status:
    get:
      summary: Состояние приложения
      operationId: apiStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/settings:
    get:
      summary: Настройки в виде, удобном интерфейсу (с умолчаниями)
      operationId: apiSettingsGet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    post:
      summary: Частично обновить настройки
      description: |
        Передаются только изменённые поля (та же структура, что в ответе GET). Все поля
        проверяются до записи: при ошибке `config.yaml` не меняется. Секции CLI (`schedule`,
        `yandex_music.auto_upload`) не затрагиваются.
      operationId: apiSettingsPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [ok, settings]
                properties:
                  ok:
                    type: boolean
                  settings:
                    $ref: "#/components/schemas/Settings"
        "400":
          description: Неверное значение
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                  field:
                    type: string
                    description: Путь поля, например `yandex_music.upload_delay`

  /api/validate/soundcloud:
    post:
      summary: Проверить профиль SoundCloud (для проверки при вводе)
      operationId: apiValidateSoundcloud
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Имя или любая ссылка на профиль
      responses:
        "200":
          description: "`ok: false` — профиль не найден или пустой ввод"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, username, profile_url, display_name]
                    properties:
                      ok: { type: boolean, const: true }
                      username: { type: string }
                      profile_url: { type: string }
                      display_name: { type: string }
                      likes_count: { type: ["integer", "null"] }
                  - $ref: "#/components/schemas/NotOk"
        "502":
          description: SoundCloud недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotOk"

  /api/validate/playlist:
    post:
      summary: Проверить ссылку на плейлист ЯМ (свой ли, название, число треков)
      description: Требует авторизации ЯМ (cookies Chrome).
      operationId: apiValidatePlaylist
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                playlist_url:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, kind, title]
                    properties:
                      ok: { type: boolean, const: true }
                      kind: { type: string }
                      title: { type: string }
                      track_count: { type: ["integer", "null"] }
                      owner: { type: string }
                  - $ref: "#/components/schemas/NotOk"

  /api/check-yandex:
    get:
      summary: Проверить авторизацию в Яндекс Музыке (cookies Chrome)
      description: Успешный результат кэшируется на 10 минут; `refresh=1` — проверить заново.
      operationId: apiCheckYandex
      parameters:
        - name: refresh
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/YandexAuthorized"
                  - $ref: "#/components/schemas/YandexUnauthorized"

  /api/tracks:
    get:
      summary: Все треки из локальной базы
      description: Последние добавленные — сверху.
      operationId: apiTracks
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [tracks]
                properties:
                  tracks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrackItem"

  /api/tracks/{id}/audio:
    get:
      summary: Аудиофайл трека для плеера
      description: Поддерживает Range (перемотка), ответ 206.
      operationId: apiTrackAudio
      parameters:
        - $ref: "#/components/parameters/TrackId"
      responses:
        "200":
          description: Файл целиком
          content:
            audio/mpeg: {}
        "206":
          description: Часть файла
        "404":
          description: Трека нет или у него нет файла

  /api/tracks/{id}/reveal:
    post:
      summary: Показать файл трека в Finder
      operationId: apiTrackReveal
      parameters:
        - $ref: "#/components/parameters/TrackId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Трека нет или у него нет файла

  /api/scan:
    post:
      summary: Проверить лайки SoundCloud (задача `scan`)
      operationId: apiScan
      responses:
        "200":
          $ref: "#/components/responses/Started"
        "409":
          $ref: "#/components/responses/Busy"

  /api/start:
    post:
      summary: Скачать выбранные треки, опционально с загрузкой в ЯМ (задача `download`)
      description: |
        Треки берутся из `tracks.csv` (по `sc_url`), предварительный скан не нужен.
        Без `track_ids` — все `pending`. Трек с файлом не перекачивается.
        Отсутствие подходящих треков сообщается событием SSE `error`, не HTTP-кодом.
      operationId: apiStart
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "200":
          $ref: "#/components/responses/Started"
        "400":
          description: track_ids передан, но не является списком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Busy"

  /api/upload:
    post:
      summary: Загрузить в ЯМ уже скачанные треки (задача `upload`)
      description: С `track_ids` — выбранные треки с файлами (в т.ч. уже «В ЯМ»); без — все `downloaded`.
      operationId: apiUpload
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                track_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          $ref: "#/components/responses/Started"
        "400":
          description: track_ids не список
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Busy"

  /api/sync:
    post:
      summary: Синхронизировать (задача `sync`)
      description: |
        Проверить лайки → скачать все `pending` → загрузить в ЯМ все `downloaded` (если задан
        плейлист) → сверить плейлист. Тот же сценарий запускает автосинхронизация (`trigger: auto`).
      operationId: apiSync
      responses:
        "200":
          $ref: "#/components/responses/Started"
        "409":
          $ref: "#/components/responses/Busy"

  /api/cancel:
    post:
      summary: Запросить отмену текущей задачи
      description: |
        Устанавливает флаг отмены; active_task сбрасывает сам воркер, когда остановится
        (текущий шаг ffmpeg дорабатывает до конца). Итог — события SSE `cancelled` и `task_end`.
      operationId: apiCancel
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/force-clear:
    post:
      summary: Аварийно сбросить «зависшую» активную задачу
      description: |
        Сбрасывает active_task, только если поток задачи уже завершён. Пока он жив —
        409: иначе новая задача стартовала бы параллельно ещё работающему воркеру.
      operationId: apiForceClear
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [ok, cleared]
                properties:
                  ok:
                    type: boolean
                  cleared:
                    description: Имя сброшенной задачи или null
                    type: ["string", "null"]
        "409":
          description: Поток задачи ещё работает
          content:
            application/json:
              schema:
                type: object
                required: [ok, alive, error]
                properties:
                  ok: { type: boolean, const: false }
                  alive: { type: boolean, const: true }
                  error: { type: string }

  /api/mark-uploaded:
    post:
      summary: «Уже в ЯМ»
      description: |
        `ym`: `none`/`sent` → `manual` (проверится при сверке); `missing`/`rejected` → `pinned`
        (в ЯМ по подтверждению пользователя — проверка его не меняет). `confirmed`/`manual`/`pinned` не трогаются.
      operationId: apiMarkUploaded
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkUploadedRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [ok, marked]
                properties:
                  ok: { type: boolean }
                  marked: { type: integer }
        "400":
          description: Нет ни track_ids, ни mark_all_pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Выполняется задача
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/unmark-uploaded:
    post:
      summary: «Снять «В ЯМ»»
      description: |
        Любое `ym` → `none` (не отправлен); файл убирается из
        `upload_archive.txt`, чтобы его можно было загрузить снова.
      operationId: apiUnmarkUploaded
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [track_ids]
              properties:
                track_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [ok, unmarked]
                properties:
                  ok: { type: boolean }
                  unmarked: { type: integer }
        "400":
          description: Нет track_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Выполняется задача
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/open-folder:
    post:
      summary: Открыть папку с музыкой в Finder
      operationId: apiOpenFolder
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/check-playlist:
    get:
      summary: Последний результат сверки (от кнопки или синхронизации), без обращения к ЯМ
      operationId: apiCheckPlaylistLast
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report:
                    oneOf:
                      - $ref: "#/components/schemas/PlaylistReport"
                      - type: "null"
    post:
      summary: Сверить треки «В ЯМ» из локальной базы с плейлистом Яндекс Музыки
      description: |
        Сопоставление по нормализованным исполнителю и названию (или только названию).
        Записывает результат в `ym` каждого трека (кроме `none` и `pinned`): найден → `confirmed`;
        не найден: `confirmed`/`manual` → `missing`, `sent` старше суток → `rejected`.
        Плейлист должен принадлежать текущему аккаунту.
      operationId: apiCheckPlaylist
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistReport"
        "400":
          description: URL плейлиста не задан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Нет авторизации, чужой/не найденный плейлист или ошибка API ЯМ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/history:
    get:
      summary: История операций (последние 50, новые сверху), без журналов
      operationId: apiHistory
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/HistoryRecordBase"
                        - type: object
                          properties:
                            events_count: { type: integer }

  /api/history/{id}:
    get:
      summary: Запись истории с журналом событий
      operationId: apiHistoryItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HistoryRecordBase"
                  - type: object
                    properties:
                      events:
                        type: array
                        description: События SSE задачи (без прогресса), до 300; поле `t` — время
                        items:
                          type: object
        "404":
          description: Нет такой записи

  /api/progress:
    get:
      summary: Поток событий прогресса (SSE)
      description: |
        Формат: `text/event-stream`, каждая запись `data: <json>`.
        Полное описание полей событий — в `sse-events.md`.
      operationId: apiProgress
      responses:
        "200":
          description: Бесконечный поток
          content:
            text/event-stream:
              schema:
                type: string

components:
  parameters:
    TrackId:
      name: id
      in: path
      required: true
      description: SoundCloud id трека
      schema:
        type: string

  responses:
    Started:
      description: Задача запущена
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OkResponse"
    Busy:
      description: Выполняется другая задача или предыдущая ещё останавливается
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    NotOk:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, const: false }
        error: { type: string }

    TrackStats:
      type: object
      description: Агрегаты по tracks.csv (по признакам состояния) + размер папки музыки
      properties:
        total: { type: integer }
        on_disk: { type: integer, description: Треки с файлом }
        ym:
          type: object
          description: Число треков в каждом состоянии `ym`
          additionalProperties: { type: integer }
        in_ym: { type: integer, description: "ym = confirmed или pinned" }
        not_in_ym: { type: integer }
        new: { type: integer, description: Не скачаны, не в ЯМ, доступны, в лайках }
        ready: { type: integer, description: Файл есть, ym = none }
        unliked: { type: integer }
        unavailable: { type: integer }
        with_errors: { type: integer }
        local_files: { type: integer }
        size_mb: { type: number }

    StatusResponse:
      type: object
      properties:
        username:
          type: string
          description: Имя пользователя SoundCloud (пусто — не настроено)
        configured:
          type: boolean
          description: false — показать мастер первого запуска
        playlist_url:
          type: string
        stats:
          $ref: "#/components/schemas/TrackStats"
        active_task:
          description: scan | download | upload | sync | null
          type: ["string", "null"]
        task:
          oneOf:
            - type: "null"
            - type: object
              properties:
                name: { type: string }
                trigger: { type: string, enum: [manual, auto] }
                started_at: { type: number }
        autosync:
          allOf:
            - $ref: "#/components/schemas/AutosyncSettings"
            - type: object
              properties:
                last_run: { type: ["number", "null"], description: Начало последнего автозапуска (unix) }
                next_run: { type: ["number", "null"], description: "Следующий запуск (unix); null — выключено" }

    Settings:
      type: object
      properties:
        soundcloud:
          type: object
          properties:
            username: { type: string }
            profile_url: { type: string, description: Только чтение }
            max_tracks: { type: integer, minimum: 0, description: 0 — все }
            sleep_requests: { type: number, minimum: 0, maximum: 30 }
            cookies_browser: { type: string, enum: ["", chrome, safari, firefox, brave, edge, chromium, opera, vivaldi] }
        output:
          type: object
          properties:
            directory: { type: string }
            resolved_directory: { type: string, description: Только чтение — абсолютный путь }
            format: { type: string, enum: [mp3, m4a, opus, flac] }
            quality: { type: string, enum: ["128", "192", "256", "320"] }
        yandex_music:
          type: object
          properties:
            playlist_url: { type: string }
            upload_delay: { type: number, minimum: 0, maximum: 60 }
            delete_after_upload: { type: boolean }
        autosync:
          $ref: "#/components/schemas/AutosyncSettings"

    SettingsPatch:
      description: Любое подмножество полей Settings (кроме «только чтение»)
      type: object

    AutosyncSettings:
      type: object
      properties:
        enabled: { type: boolean, default: false }
        interval_hours: { type: integer, enum: [1, 3, 6, 12, 24], default: 6 }
        download: { type: boolean, default: true }
        upload: { type: boolean, default: true }
        notify: { type: boolean, default: true, description: Уведомление macOS после автосинхронизации }

    TrackItem:
      type: object
      description: Состояние трека — три независимых признака (specs/features/track-states.md)
      required: [id, title, artist, added, sc_url, has_file, ym, ym_checked_at, sent_at, liked, sc, sc_reason, error]
      properties:
        id: { type: string, description: SoundCloud id }
        title: { type: string }
        artist:
          type: string
          description: Может быть пустым до скачивания — плоский скан лайков не отдаёт исполнителя
        added: { type: string, description: "Дата появления в базе, YYYY-MM-DD" }
        sc_url: { type: string }
        has_file: { type: boolean, description: Диск — файл есть в папке музыки }
        ym:
          type: string
          enum: [none, sent, confirmed, manual, missing, rejected, pinned]
          description: |
            Яндекс Музыка: none не отправлен · sent ЯМ принял файл, трек ещё не в плейлисте ·
            confirmed найден в плейлисте · manual отмечен вручную, не проверен · missing считался в ЯМ,
            но не найден · rejected не появился за сутки · pinned в ЯМ по подтверждению пользователя
        ym_checked_at: { type: ["number", "null"], description: Время последней проверки по плейлисту (unix) }
        sent_at: { type: ["number", "null"], description: Для sent — время отправки (unix) }
        liked: { type: ["boolean", "null"], description: "SoundCloud: в лайках / пропал из лайков / неизвестно" }
        sc: { type: string, enum: [ok, unavailable], description: SoundCloud — можно ли скачать }
        sc_reason: { type: string, description: Причина недоступности (DRM, удалён, страна) }
        error: { type: string, description: Последняя ошибка }

    PlaylistReport:
      type: object
      properties:
        checked_at: { type: number }
        playlist:
          type: object
          properties:
            kind: { type: string }
            title: { type: string }
            track_count: { type: ["integer", "null"] }
            owner: { type: string }
        playlist_total: { type: integer }
        found: { type: integer, description: "ym = confirmed или pinned" }
        missing_total: { type: integer }
        missing:
          type: array
          description: Треки с ym = missing после этой сверки
          items:
            $ref: "#/components/schemas/TrackItem"
        rejected:
          type: array
          description: Треки с ym = rejected
          items:
            $ref: "#/components/schemas/TrackItem"
        sent_waiting:
          type: array
          description: Треки с ym = sent (ещё не найдены, сутки не прошли)
          items:
            $ref: "#/components/schemas/TrackItem"
        changes:
          type: object
          description: Что изменила эта сверка
          properties:
            confirmed: { type: integer, description: Стали confirmed }
            missing: { type: integer, description: Стали missing }
            rejected: { type: integer, description: sent → rejected по тайм-ауту }
            waiting: { type: integer, description: Остались sent }
        duplicates: { type: integer, description: Число лишних копий }
        duplicates_list:
          type: array
          items:
            type: object
            properties:
              artist: { type: string }
              title: { type: string }
              count: { type: integer }
        processing: { type: integer }
        processing_list:
          type: array
          items:
            type: object
            properties:
              artist: { type: string }
              title: { type: string }

    HistoryRecordBase:
      type: object
      properties:
        id: { type: string }
        task: { type: string, enum: [scan, download, upload, sync] }
        trigger: { type: string, enum: [manual, auto] }
        started_at: { type: number }
        finished_at: { type: ["number", "null"] }
        status: { type: string, enum: [ok, warn, error, cancelled] }
        summary:
          type: object
          description: Итог задачи (поля all_done / scan_complete / cancelled) или {message} при ошибке

    StartRequest:
      type: object
      properties:
        upload:
          type: boolean
          description: После скачивания загружать в ЯМ
          default: true
        track_ids:
          type: array
          items:
            type: string
          description: Список sc_id выбранных треков; не передан — все `pending`

    MarkUploadedRequest:
      type: object
      description: |
        Либо непустой track_ids, либо mark_all_pending=true (пометить все, кроме уже uploaded).
      properties:
        track_ids:
          type: array
          items:
            type: string
        mark_all_pending:
          type: boolean

    YandexAuthorized:
      type: object
      required: [authorized, login]
      properties:
        authorized: { type: boolean, const: true }
        login: { type: string }
        uid: { type: integer }
        cached: { type: boolean }

    YandexUnauthorized:
      type: object
      required: [authorized]
      properties:
        authorized: { type: boolean, const: false }
        error: { type: string }
