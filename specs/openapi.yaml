openapi: 3.1.0
info:
  title: Музыкальный — локальный HTTP API
  description: |
    REST API веб-приложения (`web_app.py`). Сервер слушает только 127.0.0.1.
    Поток прогресса — отдельный контракт GET `/api/progress`, см. `sse-events.md`.
  version: "1.1.0"

servers:
  - url: http://127.0.0.1:5555
    description: Локальный экземпляр по умолчанию

paths:
  /:
    get:
      summary: Главная страница
      description: HTML одностраничного приложения (встроенный шаблон).
      responses:
        "200":
          description: HTML-документ

  /api/status:
    get:
      summary: Текущее состояние UI и конфигурации
      operationId: apiStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/save:
    post:
      summary: Сохранить настройки SoundCloud и Яндекс Музыки
      operationId: apiSave
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRequest"
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/scan:
    post:
      summary: Запустить сканирование лайков SoundCloud
      operationId: apiScan
      responses:
        "200":
          description: Задача запущена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "409":
          description: Уже выполняется другая задача
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/start:
    post:
      summary: Скачать выбранные треки (опционально с загрузкой в ЯМ)
      description: |
        Треки берутся из локальной базы `tracks.csv` (по `sc_url`), предварительный
        скан не нужен — после перезапуска приложения скачивание доступно сразу.
        Без `track_ids` скачиваются все треки со статусом `pending`.
        Отсутствие подходящих треков сообщается событием SSE `error`, не HTTP-кодом.
      operationId: apiStart
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "200":
          description: Задача запущена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: track_ids передан, но не является списком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Занято (выполняется задача или предыдущая ещё останавливается)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/upload:
    post:
      summary: Загрузить в Яндекс Музыку уже скачанные треки
      operationId: apiUpload
      responses:
        "200":
          description: Задача запущена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "409":
          description: Занято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cancel:
    post:
      summary: Запросить отмену текущей задачи
      description: |
        Устанавливает флаг отмены; active_task сбрасывает сам воркер, когда остановится
        (текущий шаг ffmpeg дорабатывает до конца). Итог — событие SSE `cancelled`.
      operationId: apiCancel
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/force-clear:
    post:
      summary: Аварийно сбросить «зависшую» активную задачу
      description: |
        Сбрасывает active_task, только если поток задачи уже завершён. Пока он жив —
        409: иначе новая задача стартовала бы параллельно ещё работающему воркеру.
      operationId: apiForceClear
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [ok, cleared]
                properties:
                  ok:
                    type: boolean
                  cleared:
                    description: Имя сброшенной задачи или null
                    type: ["string", "null"]
        "409":
          description: Поток задачи ещё работает
          content:
            application/json:
              schema:
                type: object
                required: [ok, alive, error]
                properties:
                  ok:
                    type: boolean
                    const: false
                  alive:
                    type: boolean
                    const: true
                  error:
                    type: string

  /api/mark-uploaded:
    post:
      summary: Пометить треки как уже загруженные в ЯМ
      operationId: apiMarkUploaded
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkUploadedRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [ok, marked]
                properties:
                  ok:
                    type: boolean
                  marked:
                    type: integer
        "400":
          description: Нет ни track_ids, ни mark_all_pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Выполняется задача
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/open-folder:
    post:
      summary: Открыть папку с музыкой в Finder
      operationId: apiOpenFolder
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/check-yandex:
    get:
      summary: Проверить авторизацию в Яндекс Музыке (cookies Chrome)
      operationId: apiCheckYandex
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/YandexAuthorized"
                  - $ref: "#/components/schemas/YandexUnauthorized"

  /api/tracks:
    get:
      summary: Все треки из локальной базы
      description: Для показа списка сразу при загрузке страницы, без скана SoundCloud. Последние добавленные — сверху.
      operationId: apiTracks
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [tracks]
                properties:
                  tracks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrackItem"

  /api/check-playlist:
    post:
      summary: Сверить треки «в ЯМ» из локальной базы с плейлистом Яндекс Музыки
      description: |
        Сопоставление по нормализованным исполнителю и названию (или только названию).
        Статусы не меняет. Плейлист должен принадлежать текущему аккаунту.
      operationId: apiCheckPlaylist
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistCheck"
        "400":
          description: URL плейлиста не задан или плейлист не определён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Нет авторизации в ЯМ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Ошибка API Яндекс Музыки (в т.ч. чужой плейлист)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/progress:
    get:
      summary: Поток событий прогресса (SSE)
      description: |
        Формат: `text/event-stream`, каждая запись `data: <json>`.
        Полное описание полей событий — в `sse-events.md`.
      operationId: apiProgress
      responses:
        "200":
          description: Бесконечный поток
          content:
            text/event-stream:
              schema:
                type: string

components:
  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    TrackStats:
      type: object
      description: Агрегаты по tracks.csv + размер папки Music
      properties:
        total:
          type: integer
        uploaded:
          type: integer
        downloaded:
          type: integer
        pending:
          type: integer
        not_in_likes:
          type: integer
        local_files:
          type: integer
        size_mb:
          type: number

    StatusResponse:
      type: object
      properties:
        username:
          type: string
          description: Имя пользователя SoundCloud из profile_url
        playlist_url:
          type: string
        stats:
          $ref: "#/components/schemas/TrackStats"
        active_task:
          description: Имя активной задачи или null
          type: ["string", "null"]

    SaveRequest:
      type: object
      properties:
        username:
          type: string
          description: Короткое имя или полный URL профиля SoundCloud
        playlist_url:
          type: string
          nullable: true

    TrackItem:
      type: object
      required: [id, title, artist, status]
      properties:
        id:
          type: string
          description: SoundCloud id
        title:
          type: string
        artist:
          type: string
          description: Может быть пустым до скачивания — плоский скан лайков не отдаёт исполнителя
        status:
          type: string
          enum: [pending, downloaded, uploaded, not_in_likes]

    PlaylistCheck:
      type: object
      properties:
        playlist_total:
          type: integer
        found:
          type: integer
        missing_total:
          type: integer
        missing:
          type: array
          description: Первые 30 ненайденных
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              artist:
                type: string
        duplicates:
          type: integer
        processing:
          type: integer
          description: Треки плейлиста, ещё недоступные для прослушивания (обработка)

    StartRequest:
      type: object
      properties:
        upload:
          type: boolean
          description: После скачивания загружать в ЯМ
          default: true
        track_ids:
          type: array
          items:
            type: string
          description: Список sc_id выбранных треков; не передан — все `pending`

    MarkUploadedRequest:
      type: object
      description: |
        Либо непустой track_ids, либо mark_all_pending=true (пометить все незавершённые кроме уже uploaded).
      properties:
        track_ids:
          type: array
          items:
            type: string
        mark_all_pending:
          type: boolean

    YandexAuthorized:
      type: object
      required: [authorized, login]
      properties:
        authorized:
          type: boolean
          const: true
        login:
          type: string

    YandexUnauthorized:
      type: object
      required: [authorized]
      properties:
        authorized:
          type: boolean
          const: false
        error:
          type: string
